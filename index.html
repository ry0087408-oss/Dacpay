<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2a4a">
<title>DocPay</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;800&display=swap">
<style>
:root{--bg:#f3f5f9;--surface:#fff;--ink:#17223b;--muted:#5d6985;--line:#d9deea;--accent:#0f766e;--soft:#e2f3f1;--danger:#b42318;--grad:linear-gradient(135deg,#0f766e,#0b5a7a);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1524;--surface:#18213a;--ink:#eef1f8;--muted:#9aa6c4;--line:#2a3555;--accent:#2dd4bf;--soft:#12332f;--danger:#ff8a80}}
:root[data-theme="dark"]{--bg:#0f1524;--surface:#18213a;--ink:#eef1f8;--muted:#9aa6c4;--line:#2a3555;--accent:#2dd4bf;--soft:#12332f;--danger:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg) linear-gradient(180deg,rgba(15,118,110,.12),transparent 360px) no-repeat;color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:17px;line-height:1.5}
.top{display:flex;align-items:center;gap:12px;margin:12px 16px 0;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,#0b2a4a,#0f5c63);color:#fff;box-shadow:0 14px 32px -16px rgba(11,42,74,.6)}
.logo{width:48px;height:48px;border-radius:14px;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 14px -6px rgba(0,0,0,.5)}
.logo img{display:block;width:36px;height:36px}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.4px;line-height:1.1}
.sub{margin:2px 0 0;font-size:14px;color:#cfe3ea}
.tabs{display:flex;gap:6px;margin:12px 16px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.tabs button{flex:1;font:inherit;font-weight:600;color:var(--muted);background:transparent;border:0;border-radius:10px;padding:10px 8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--grad);color:#fff}
.badge{display:inline-block;min-width:22px;margin-left:4px;padding:0 6px;border-radius:99px;background:rgba(127,127,127,.25);font-size:13px}
.pager{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;padding:2px 16px 20px}
.in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 10px 28px -20px rgba(23,34,59,.45)}
.lbl{display:block;font-weight:600;margin:12px 0 6px}.lbl:first-child{margin-top:0}
input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
button{font:inherit;cursor:pointer}
.btn{width:100%;margin-top:16px;background:var(--grad);color:#fff;border:0;border-radius:12px;padding:13px 16px;font-weight:600}
.attach{width:100%;background:transparent;color:var(--ink);border:2px dashed var(--line);border-radius:12px;padding:14px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:7px 14px}
.chip[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#fff;font-weight:600}
.row{display:flex;gap:8px;margin-top:12px}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:15px;flex:none}
.ghost.warn{color:var(--danger);border-color:var(--danger)}
.picked{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pk{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:99px;padding:4px 6px 4px 12px;font-size:15px;max-width:100%}
.pk button{background:transparent;border:0;color:var(--muted);padding:2px 6px}
.msg{min-height:1.4em;margin:10px 0 0;color:var(--accent);font-weight:600}
.hint,.empty{color:var(--muted);font-size:15px;margin:0;text-align:center}
.empty{padding:18px 0}
.doc{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;padding:12px 14px}
.dh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dh b{display:block;font-weight:600}.dh small{color:var(--muted);font-size:15px}
.tag{flex:none;font-size:13px;color:var(--accent);background:var(--soft);border-radius:99px;padding:2px 10px}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.files:empty{display:none}
.fopen{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px;color:var(--ink);font-size:15px}
.fopen img{display:block;width:92px;height:70px;object-fit:cover;border-radius:7px}
.da{display:flex;justify-content:flex-end;margin-top:10px}
.credit{margin:0;padding:6px 0 10px;text-align:center;font-size:12px;color:var(--muted);opacity:.7}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.viewer{position:fixed;inset:0;z-index:100;background:#05090f;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.vbar{display:flex;align-items:center;gap:10px;padding:10px 12px;color:#fff;font-weight:600}
.vbar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.vnav{display:flex;gap:6px}
.vbtn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:8px 14px}
.vbtn:disabled{opacity:.35}
.vbody{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;touch-action:pan-x pan-y pinch-zoom}
.vbody img{max-width:100%;max-height:100%;object-fit:contain}
.vbody iframe{width:100%;height:100%;border:0;background:#fff}
</style>
</head>

<script>
var KEY="docpay-v2",state={sections:[],docs:[],sel:null,filter:"all"},pending=[],armed=null,vItems=[],vIdx=0,viewer=null,hydTok=0;
function $(i){return document.getElementById(i)}
function uid(){return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function secById(id){return state.sections.filter(function(s){return s.id===id})[0]||null}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
(function load(){
  try{var r=localStorage.getItem(KEY);if(r){state=JSON.parse(r)}}catch(e){}
  if(!state.sections.length&&!state.docs.length){
    try{var o=localStorage.getItem("goddem-v1");if(o){var p=JSON.parse(o);
      state.sections=p.sections.map(function(s){return{id:s.id,name:s.name}});
      p.sections.forEach(function(s){s.docs.forEach(function(d){state.docs.push({id:d.id,secId:s.id,name:d.name,note:d.note||"",created:Date.now()})})})}}catch(e){}
  }
  if(!state.sections.length)state.sections=["ID cards","Education","Bank and money","Home"].map(function(n,i){return{id:"s"+i,name:n}});
  if(!secById(state.sel))state.sel=state.sections[0].id;
  state.filter="all";
})();
/* file storage */
var dbp=null;
function db(){if(dbp)return dbp;dbp=new Promise(function(res,rej){try{var r=indexedDB.open("goddem-files",1);r.onupgradeneeded=function(){r.result.createObjectStore("files",{keyPath:"id"})};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}catch(e){rej(e)}});return dbp}
function tx(mode,fn){return db().then(function(d){return new Promise(function(res,rej){var t=d.transaction("files",mode),q=fn(t.objectStore("files"));t.oncomplete=function(){res(q&&q.result)};t.onerror=function(){rej(t.error)}})})}
function allFiles(){return tx("readonly",function(s){return s.getAll()})}
function putFile(o){return tx("readwrite",function(s){return s.put(o)})}
function delFile(id){return tx("readwrite",function(s){return s.delete(id)})}
/* render */
function renderAdd(){
  $("addSecs").innerHTML=state.sections.map(function(s){return '<button class="chip" data-sel="'+s.id+'" aria-pressed="'+(s.id===state.sel)+'">'+esc(s.name)+'</button>'}).join("");
  $("picked").innerHTML=pending.map(function(f,i){return '<span class="pk">'+esc(f.name)+'<button data-unpick="'+i+'" aria-label="Remove file">✕</button></span>'}).join("");
}
function renderSaved(){
  $("cnt").textContent=state.docs.length;
  var f=state.filter;
  var chips='<button class="chip" data-filter="all" aria-pressed="'+(f==="all")+'">All ('+state.docs.length+')</button>'+state.sections.map(function(s){
    var n=state.docs.filter(function(d){return d.secId===s.id}).length;
    return '<button class="chip" data-filter="'+s.id+'" aria-pressed="'+(f===s.id)+'">'+esc(s.name)+' ('+n+')</button>'}).join("");
  $("filter").innerHTML=chips;
  var docs=state.docs.filter(function(d){return f==="all"||d.secId===f}).slice().reverse();
  var html=docs.map(function(d){
    var s=secById(d.secId);
    return '<article class="doc"><div class="dh"><div><b>'+esc(d.name)+'</b>'+(d.note?'<small>'+esc(d.note)+'</small>':'')+'</div>'+(s?'<span class="tag">'+esc(s.name)+'</span>':'')+'</div><div class="files" id="fl_'+d.id+'"></div><div class="da"><button class="ghost warn" data-deldoc="'+d.id+'">'+(armed===d.id?"Tap again to delete":"Delete")+'</button></div></article>'}).join("");
  if(!docs.length)html='<p class="empty">Nothing saved here yet. Use the Add document tab to save your first one.</p>';
  if(f!=="all"&&secById(f))html+='<div class="da"><button class="ghost warn" id="delSec">'+(armed===f?"Tap again to delete section":"Delete this section")+'</button></div>';
  $("list").innerHTML=html;
  hydrate(docs);
}
function thumb(f,url,i){
  var b=document.createElement("button");b.className="fopen";b.type="button";b.setAttribute("aria-label","Open "+f.name);
  if(f.type.indexOf("image/")===0){var im=document.createElement("img");im.src=url;im.alt=f.name;b.appendChild(im)}else{b.textContent="📄 "+f.name}
  b.onclick=function(){openViewer(i)};return b}
function hydrate(docs){
  var tok=++hydTok;
  allFiles().then(function(list){
    if(tok!==hydTok)return;
    vItems.forEach(function(x){URL.revokeObjectURL(x.url)});vItems=[];
    docs.forEach(function(d){var box=$("fl_"+d.id);if(!box)return;
      list.filter(function(f){return f.docId===d.id}).forEach(function(f){var url=URL.createObjectURL(f.blob);vItems.push({f:f,url:url,doc:d});box.appendChild(thumb(f,url,vItems.length-1))})})
  }).catch(function(){});
}
function renderAll(){renderAdd();renderSaved()}
/* actions */
function msg(t){$("msg").textContent=t}
function goTab(i){var p=$("pager");p.scrollTo({left:i*p.clientWidth,behavior:"smooth"})}
function setTab(i){var t=document.querySelectorAll(".tabs button");for(var k=0;k<t.length;k++)t[k].setAttribute("aria-selected",String(k===i))}
function addSection(){var i=$("newSec"),v=i.value.trim();if(!v)return;var s={id:uid(),name:v};state.sections.push(s);state.sel=s.id;i.value="";persist();renderAdd();renderSaved()}
function saveDoc(){
  var name=$("dName").value.trim();
  if(!name){msg("Enter a document name first.");$("dName").focus();return}
  var id=uid(),note=$("dNote").value.trim(),sec=state.sel;
  Promise.all(pending.map(function(f){return putFile({id:uid(),docId:id,name:f.name,type:f.type||"",blob:f})})).then(function(){
    state.docs.push({id:id,secId:sec,name:name,note:note,created:Date.now()});
    pending=[];$("dName").value="";$("dNote").value="";persist();state.filter="all";renderAll();msg("Saved ✓");goTab(1);
    setTimeout(function(){msg("")},2500);
  }).catch(function(){msg("Could not save the files. Please try again.")});
}
function deleteDocs(ids){
  state.docs=state.docs.filter(function(d){return ids.indexOf(d.id)<0});
  allFiles().then(function(l){l.filter(function(f){return ids.indexOf(f.docId)>-1}).forEach(function(f){delFile(f.id)})}).catch(function(){});
  persist();
}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var d=b.dataset;
  if(d.tab!==undefined)goTab(+d.tab);
  else if(d.sel){state.sel=d.sel;persist();renderAdd()}
  else if(d.unpick!==undefined){pending.splice(+d.unpick,1);renderAdd()}
  else if(d.filter){state.filter=d.filter;armed=null;renderSaved()}
  else if(d.deldoc){if(armed===d.deldoc){armed=null;deleteDocs([d.deldoc]);renderSaved()}else{armed=d.deldoc;renderSaved()}}
  else if(b.id==="delSec"){var f=state.filter;
    if(armed===f){var ids=state.docs.filter(function(x){return x.secId===f}).map(function(x){return x.id});deleteDocs(ids);
      state.sections=state.sections.filter(function(s){return s.id!==f});if(!state.sections.length)state.sections=[{id:uid(),name:"My documents"}];
      if(!secById(state.sel))state.sel=state.sections[0].id;state.filter="all";armed=null;persist();renderAll()}
    else{armed=f;renderSaved()}}
  else if(b.id==="pick")$("fileIn").click();
  else if(b.id==="save")saveDoc();
  else if(b.id==="addSec")addSection();
});
$("fileIn").onchange=function(e){Array.prototype.slice.call(e.target.files).forEach(function(f){pending.push(f)});e.target.value="";renderAdd()};
$("newSec").onkeydown=function(e){if(e.key==="Enter")addSection()};
$("pager").addEventListener("scroll",function(){var p=$("pager");setTab(Math.round(p.scrollLeft/p.clientWidth))});
/* full-screen viewer */
function openViewer(i){
  if(!vItems[i])return;closeViewer();vIdx=i;
  var v=document.createElement("div");v.className="viewer";v.setAttribute("role","dialog");v.setAttribute("aria-modal","true");
  v.innerHTML='<div class="vbar"><button class="vbtn" id="vBack">‹ Back</button><span id="vTitle"></span><div class="vnav" id="vNav"><button class="vbtn" id="vPrev" aria-label="Previous file">‹</button><button class="vbtn" id="vNext" aria-label="Next file">›</button></div></div><div class="vbody" id="vBody"></div>';
  document.body.appendChild(v);viewer=v;document.body.style.overflow="hidden";
  $("vBack").onclick=closeViewer;$("vPrev").onclick=function(){step(-1)};$("vNext").onclick=function(){step(1)};
  var sx=0,sy=0,multi=false,body=$("vBody");
  body.addEventListener("touchstart",function(e){multi=e.touches.length>1;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  body.addEventListener("touchmove",function(e){if(e.touches.length>1)multi=true},{passive:true});
  body.addEventListener("touchend",function(e){if(multi||e.touches.length)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>80&&Math.abs(dy)<60)step(dx<0?1:-1)},{passive:true});
  showItem();$("vBack").focus();
}
function showItem(){
  var it=vItems[vIdx],body=$("vBody");body.innerHTML="";
  if(it.f.type.indexOf("image/")===0){var im=document.createElement("img");im.src=it.url;im.alt=it.f.name;body.appendChild(im)}
  else{var fr=document.createElement("iframe");fr.src=it.url;fr.title=it.f.name;body.appendChild(fr)}
  $("vTitle").textContent=it.doc.name+" · "+(vIdx+1)+" of "+vItems.length;
  $("vPrev").disabled=vIdx===0;$("vNext").disabled=vIdx===vItems.length-1;$("vNav").style.display=vItems.length>1?"flex":"none";
}
function step(d){var n=vIdx+d;if(viewer&&n>=0&&n<vItems.length){vIdx=n;showItem()}}
function closeViewer(){if(viewer){viewer.remove();viewer=null;document.body.style.overflow=""}}
document.addEventListener("keydown",function(e){
  if(viewer){if(e.key==="Escape")closeViewer();else if(e.key==="ArrowLeft")step(-1);else if(e.key==="ArrowRight")step(1);return}
  if(e.key==="Enter"&&(e.target.id==="dName"||e.target.id==="dNote"))saveDoc();
});
renderAll();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
</body>
</html>
